databases:
  - name: drawboard-db
    databaseName: drawboard
    user: drawboard

services:
  - type: web
    name: drawboard
    runtime: ruby
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec rails server
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drawboard-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"